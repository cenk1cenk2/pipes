---
# https://taskfile.dev

version: "3"

vars:
  GO_LD_FLAGS: -w -s -X main.version=BUILD.$(date +%Y%m%dT%H%M%S)
  BINARY_DIR: dist
  BINARY_NAME: pipe
  BINARY_APPEND_OS: true
  BINARY_APPEND_ARCH: true

env:
  CGO_ENABLED: 0

tasks:
  clean:
    desc: Cleans the output binary folder and build cache.
    cmds:
      - go clean
      - rm -f {{ .BINARY_DIR }}

  test:
    desc: Tests the given application with ginkgo.
    cmds:
      - |-
        go tool ginkgo \
        --cover --coverpkg=./... --coverprofile=coverage.out \
        -vv --silence-skips --fail-fast -r \
        {{ .CLI_ARGS }} \
        ./...

  lint:
    desc: Lints the application with golangci-lint.
    cmds:
      - golangci-lint run {{ .CLI_ARGS }}

  build.platform:
    internal: true
    vars:
      binary_output: "{{ .BINARY_DIR }}/{{ .BINARY_NAME }}{{ if .BINARY_APPEND_OS }}-{{ .os }}{{ end }}{{ if .BINARY_APPEND_ARCH }}-{{ .arch }}{{ end }}"
    cmds:
      - GOOS={{ .os }} GOARCH={{ .arch }} go build -mod=vendor {{- if .GO_LD_FLAGS }} -ldflags="{{ .GO_LD_FLAGS }}"{{- end }} -o {{ .binary_output }}
    sources:
      - "**/*.go"
      - "go.{mod,sum}"
    generates:
      - "{{ .binary_output }}"

  start:
    desc: Starts the given application.
    interactive: true
    env:
      LOG_LEVEL: debug
    cmds:
      - go run . {{ .CLI_ARGS }}

  build:
    desc: Builds the application.
    deps:
      - task: build.platform
        vars:
          os: linux
          arch: amd64

  docs:
    desc: Generates the documentation for the application.
    interactive: true
    env:
      LOG_LEVEL: trace
    # urfave/cli validates the required flags of every parent command before it dispatches
    # to a subcommand, so a pipe whose root carries required flags has to satisfy them
    # before the docs command it never reads them for can run. DOCS_ENV is where such a
    # pipe seeds them, from Taskfile.yml.
    cmds:
      - "{{ .DOCS_ENV }} go run . docs markdown"

  help:
    desc: Generates help for the application.
    cmds:
      - go run . --help
