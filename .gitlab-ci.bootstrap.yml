---
stages:
  - build
  - container

variables:
  GOPATH: $CI_PROJECT_DIR/.go

build:
  stage: build
  image: golang:1.27-alpine
  variables:
    GO_BUILD_BINARY_NAME: pipe
    GO_BUILD_LINKER_FLAGS: -w -s
    GO_BUILD_VARIABLES: |-
      main.version: bootstrap.{{ now | date "2006-01-02T15:04:05Z0700" }}
  script:
    - wget -O- -nv https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | BINDIR=/usr/bin sh -s
    - go work vendor
    - |-
      for mod in $(go list -m -f '{{.Dir}}'); do
        go -C "$mod" mod verify
      done
    - go build -C go -mod=vendor -o dist/pipe-bootstrap
    - ./go/dist/pipe-bootstrap --version
    # vendoring covers the whole workspace, so it is worth doing once rather than
    # once per module.
    - GO_CWD=./internal ./go/dist/pipe-bootstrap lint
    - GO_CWD=./go ./go/dist/pipe-bootstrap lint
    - GO_CWD=./buildah ./go/dist/pipe-bootstrap lint
    - GO_CWD=./semantic-release ./go/dist/pipe-bootstrap lint
    - GO_CWD=./go ./go/dist/pipe-bootstrap build
    - GO_CWD=./buildah ./go/dist/pipe-bootstrap build
    - GO_CWD=./semantic-release ./go/dist/pipe-bootstrap build
  cache:
    # the job vendors the workspace anew on every run, so only the go caches are kept: the
    # downloaded module archives, and the build and linter caches the bootstrap pipe writes.
    - key: bootstrap
      paths:
        - .go/pkg/mod/cache/download/
        - .go/go-build/
        - .go/golangci-lint/
  artifacts:
    paths:
      - go/dist/
      - buildah/dist/
      - semantic-release/dist/
  tags:
    - amd64
    - docker

container:
  stage: container
  image: quay.io/buildah/stable:latest
  variables:
    CONTAINER_IMAGE_TAGS: bootstrap
    CONTAINER_REGISTRY_USERNAME: $DOCKERHUB_USERNAME
    CONTAINER_REGISTRY_PASSWORD: $DOCKERHUB_PASSWORD
  script:
    # the buildah pipe built one stage ago is what builds every bootstrap image:
    # the published :bootstrap image is what this run is about to replace, so
    # reaching for it here would build the new images with the old binary.
    - ./buildah/dist/pipe-linux-amd64 build
  parallel:
    matrix:
      - CONTAINER_FILE_CONTEXT: ./go
        CONTAINER_IMAGE_NAME: cenk1cenk2/pipe-go
        CONTAINER_IMAGE_BUILD_ARGS: |-
          GO_VERSION: 1.27-alpine
      - CONTAINER_FILE_CONTEXT: ./buildah
        CONTAINER_IMAGE_NAME: cenk1cenk2/pipe-buildah
        CONTAINER_IMAGE_BUILD_ARGS: |-
          BUILDAH_VERSION: latest
      - CONTAINER_FILE_CONTEXT: ./semantic-release
        CONTAINER_IMAGE_NAME: cenk1cenk2/pipe-semantic-release
        CONTAINER_IMAGE_BUILD_ARGS: |-
          NODE_VERSION: 26-alpine
  tags:
    - amd64
    - docker
