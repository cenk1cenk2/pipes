---
include:
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: mise
      dir: mise
      release-variable: SEMANTIC_RELEASE_TAG_MISE
      container-matrix:
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            BASE_IMAGE: docker.io/alpine:3
          CONTAINER_IMAGE_TAGS: |-
            latest
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            BASE_IMAGE: docker.io/debian:trixie-slim
          CONTAINER_IMAGE_TAGS: |-
            latest-glibc
