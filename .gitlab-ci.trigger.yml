---
# One pipe becomes one trigger job here, and that job starts the child pipeline
# that builds and publishes it. Inputs are interpolated when the file is
# compiled, before any rule is evaluated, so $[[inputs.dir]] below lands in
# changes: paths as a literal directory. A runtime variable would not: nested
# variable references are never expanded inside changes: paths.
spec:
  inputs:
    name:
      type: string
      description: >-
        The name of the pipe, which names the trigger job and suffixes the
        published image. Kept apart from dir so a rename of either one does not
        drag the other along, even though every pipe spells them the same today.
    dir:
      type: string
      description: >-
        The directory of the pipe, relative to the repository root. This is what
        the changes: paths below watch and what the child pipeline builds in.
    container-matrix:
      type: array
      description: A matrix of containers for building images.
    changes:
      type: array
      description: >-
        Paths outside the pipe directory that rebuild the pipe in a merge request.
        A pipe that does not import internal leaves it out.
      default:
        - internal/**/*
---
"pipe-$[[inputs.name]]":
  stage: pipes
  # global variables are forwarded to the child as trigger variables, expanded here
  # where $CI_PROJECT_DIR is still empty, so the go paths would land at /.go and
  # outrank the child's own definitions.
  inherit:
    variables: false
  variables:
    # a child pipeline cannot address the pipeline that started it, so the parent
    # id is handed down as a variable for the child's needs: block to point at.
    CI_PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    strategy: depend
    include:
      - local: .gitlab-ci.pipe.yml
        inputs:
          name: $[[inputs.name]]
          cwd: ./$[[inputs.dir]]
          container-image-name: docker.io/cenk1cenk2/pipe-$[[inputs.name]]
          container-matrix: $[[inputs.container-matrix]]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths:
          - .gitlab-ci.trigger.yml
          - .gitlab-ci.pipe.yml
          - .golangci.yml
          - go.work
          - go.work.sum
          - $[[inputs.dir]]/**/*
          - $[[inputs.changes]]
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    # a release tags every pipe it releases as <pipe>@<version>, and the pipeline of
    # that tag is what builds and publishes it, so a failed publish is retried on the
    # released code by running the tag pipeline again.
    - if: $CI_COMMIT_TAG =~ /^$[[inputs.name]]@/
    # a pipeline started by hand on the default branch rebuilds every pipe, for a
    # change outside every pipe directory that no release covers.
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
