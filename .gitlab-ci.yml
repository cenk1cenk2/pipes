---
stages:
  - bootstrap
  - install
  - test
  - pipes
  - post

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go/cache

include:
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: buildah
      dir: buildah
      container-matrix:
        - CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: go
      dir: go
      container-matrix:
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            GO_VERSION: '{{ env "GO_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "GO_VERSION" }}
          GO_VERSION:
            - 1.25-alpine
            - 1.26-alpine
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            GO_VERSION: '{{ env "GO_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "GO_VERSION" }}
          CONTAINER_IMAGE_TAGS_AS_LATEST: '["^heads/main$", "^tags/.*"]'
          GO_VERSION:
            - 1.27-alpine
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: helm
      dir: helm
      container-matrix:
        - CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: kustomize
      dir: kustomize
      container-matrix:
        - CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: node
      dir: node
      container-matrix:
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            NODE_VERSION: '{{ env "NODE_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "NODE_VERSION" }}
          NODE_VERSION:
            - 22
            - 22-alpine
            - 24
            - 24-alpine
            - 26
            - 26-alpine
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: pulumi
      dir: pulumi
      container-matrix:
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            PULUMI_VERSION: '{{ env "PULUMI_VERSION" }}'
            NODE_VERSION: '{{ env "NODE_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "PULUMI_VERSION" }}-node
          PULUMI_VERSION:
            - latest
          NODE_VERSION: 26-alpine
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: select-env
      dir: select-env
      container-matrix:
        - CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: semantic-release
      dir: semantic-release
      container-matrix:
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            NODE_VERSION: 26-alpine
          CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: terraform
      dir: terraform
      container-matrix:
        - CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: update-docker-hub-readme
      dir: update-docker-hub-readme
      container-matrix:
        - CONTAINER_IMAGE_TAGS: |-
            latest

.rules-default:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
    - if: $CI_COMMIT_TAG

bootstrap:
  stage: bootstrap
  trigger:
    strategy: depend
    include:
      - local: .gitlab-ci.bootstrap.yml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - .gitlab-ci.yml
          - .gitlab-ci.bootstrap.yml
          - go.work
          - go.work.sum
          - internal/**/*
          - go/**/*
          - buildah/**/*
    - if: $CI_COMMIT_TAG

install:
  stage: install
  extends: .rules-default
  image: cenk1cenk2/pipe-go:bootstrap
  script:
    - pipe install
  artifacts:
    paths:
      - vendor/
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - vendor/
        - .go/
  tags:
    - amd64
    - docker

lint:
  stage: test
  extends: .rules-default
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - .go/cache/
  parallel:
    matrix:
      - GO_CWD:
          - ./internal
          - ./tests
          - ./_template
  script:
    - pipe lint
  tags:
    - amd64
    - docker

generate:
  stage: test
  extends: .rules-default
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  script:
    - task --yes generate
    - git status --porcelain -- '**/test/mocks/**'
    - |-
      test -z "$(git status --porcelain -- '**/test/mocks/**')" || (echo "mocks are stale, run: task generate" && exit 1)
  tags:
    - amd64
    - docker

test:
  stage: test
  extends: .rules-default
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - .go/cache/
  parallel:
    matrix:
      - GO_CWD:
          - ./internal
          - ./tests
  script:
    - pipe test
  tags:
    - amd64
    - docker

docs:
  stage: test
  extends: .rules-default
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - .go/cache/
  script:
    # the readmes are generated from the command trees, so a flag added or renamed
    # without regenerating them leaves them stale.
    - task --yes docs
    - |-
      git diff --exit-code -- '**/README.md' || (echo "readmes are stale, run: task docs" && exit 1)
  tags:
    - amd64
    - docker

build:template:
  stage: test
  extends: .rules-default
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  variables:
    GO_CWD: _template
    GO_BUILD_BINARY_NAME: pipe
  script:
    # the scaffold ships no image and gets no trigger child pipeline, so this is the
    # only job that keeps it compiling against the workspace.
    - pipe build
  tags:
    - amd64
    - docker

update-docker-hub-readme:
  stage: post
  image: cenk1cenk2/pipe-update-docker-hub-readme:latest
  dependencies: []
  variables:
    DOCKER_HUB_USERNAME: $DOCKERHUB_USERNAME
    DOCKER_HUB_PASSWORD: $DOCKERHUB_API_PASSWORD
    DOCKER_HUB_README_MATRIX: |
      [
        {
          "repository": "cenk1cenk2/pipe-buildah",
          "file": "./buildah/README.md",
          "description": "Builds and publishes a container image with given conditions."
        },
        {
          "repository": "cenk1cenk2/pipe-node",
          "file": "./node/README.md",
          "description": "Node.JS operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-pulumi",
          "file": "./pulumi/README.md",
          "description": "Pulumi operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-go",
          "file": "./go/README.md",
          "description": "Golang operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-helm",
          "file": "./helm/README.md",
          "description": "Helm operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-kustomize",
          "file": "./kustomize/README.md",
          "description": "Kustomize operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-select-env",
          "file": "./select-env/README.md",
          "description": "Selects an environment given on the conditions."
        },
        {
          "repository": "cenk1cenk2/pipe-semantic-release",
          "file": "./semantic-release/README.md",
          "description": "semantic-release embedded inside a container for CI jobs."
        },
        {
          "repository": "cenk1cenk2/pipe-terraform",
          "file": "./terraform/README.md",
          "description": "Terraform helper pipe."
        },
        {
          "repository": "cenk1cenk2/pipe-update-docker-hub-readme",
          "file": "./update-docker-hub-readme/README.md",
          "description": "Updates the README on DockerHub for given repository."
        }
      ]
  tags:
    - docker
  script:
    - pipe
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "**/README.md"
    - if: $CI_COMMIT_TAG
