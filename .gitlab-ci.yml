---
stages:
  - bootstrap
  - install
  - test
  - release
  - pipes
  - post

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go/cache

include:
  - project: devops/pipelines
    ref: semantic-release@2.5.1
    file: /semantic-release/publish.gitlab-ci.yml
    inputs:
      version: bootstrap
      tags:
        - amd64
        - docker
  - local: buildah/.gitlab-ci.yml
  - local: git/.gitlab-ci.yml
  - local: github/.gitlab-ci.yml
  - local: go/.gitlab-ci.yml
  - local: helm/.gitlab-ci.yml
  - local: kustomize/.gitlab-ci.yml
  - local: mise/.gitlab-ci.yml
  - local: node/.gitlab-ci.yml
  - local: pulumi/.gitlab-ci.yml
  - local: semantic-release/.gitlab-ci.yml
  - local: terraform/.gitlab-ci.yml
  - local: update-docker-hub-readme/.gitlab-ci.yml

bootstrap:
  stage: bootstrap
  trigger:
    strategy: depend
    include:
      - local: .gitlab-ci.bootstrap.yml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - .gitlab-ci.bootstrap.yml
          # bootstrap vendors and verifies every module and lints with the shared
          # configuration, so those break it as much as what goes into its images.
          - .golangci.yml
          - go.work
          - go.work.sum
          - "*/go.{mod,sum}"
          - internal/**/*
          - "{go,buildah,semantic-release}/**/*.go"
          - "{go,buildah,semantic-release}/Dockerfile"
          - semantic-release/rootfs/**/*

install:
  stage: install
  image: cenk1cenk2/pipe-go:bootstrap
  script:
    # a restored vendor tree belongs to whatever dependency graph produced it, and go
    # refuses to read an inconsistent one -- which takes down every command that resolves
    # modules, vendoring included. The tree is cheap to rebuild, so it is never reused.
    - rm -rf vendor/
    - pipe install
  artifacts:
    # every child pipeline job reads this tree across the pipeline boundary, so it has to
    # outlive a same-pipeline retry or a sibling child pipeline started inside the window.
    expire_in: 1 week
    paths:
      - vendor/
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - .go/
  # every job that needs the tree is gated on its own paths, so this one runs whenever
  # any of them could, and a tag of internal has no pipe to build.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^internal@/
  tags:
    - amd64
    - docker

.lint:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key:
        prefix: go-build
        files:
          - go.work
      policy: pull
      paths:
        - .go/cache/
    - key: $CI_JOB_NAME_SLUG-golangci-lint
      paths:
        - .go/golangci-lint/
  script:
    - pipe lint
  tags:
    - amd64
    - docker

lint:internal:
  extends: .lint
  variables:
    GO_CWD: ./internal
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &internal-paths
        - internal/**/*
        - go.work
        - go.work.sum
        - .golangci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths: *internal-paths
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME

lint:tests:
  extends: .lint
  variables:
    GO_CWD: ./tests
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &tests-paths
        - tests/**/*
        - go.work
        - go.work.sum
        - .golangci.yml
        # the specs read the readme matrix of this file and every readme it names.
        - .gitlab-ci.yml
        - "*/README.md"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths: *tests-paths
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME

lint:template:
  extends: .lint
  variables:
    GO_CWD: ./_template
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &template-paths
        - _template/**/*
        - internal/**/*
        - go.work
        - go.work.sum
        - .golangci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths: *template-paths
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME

generate:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  variables:
    TASK_REMOTE_TRUSTED_HOSTS: gitlab.kilic.dev
  script:
    - task generate
    - git status --porcelain -- '**/test/mocks/**'
    - |-
      test -z "$(git status --porcelain -- '**/test/mocks/**')" || (echo "mocks are stale, run: task generate" && exit 1)
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &generate-paths
        - .mockery.yaml
        - Taskfile.yml
        - go.work
        - go.work.sum
        - internal/**/*
        - github/**/*
        - update-docker-hub-readme/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths: *generate-paths
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  tags:
    - amd64
    - docker

.test:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key:
        prefix: go-build
        files:
          - go.work
      policy: $GO_CACHE_POLICY
      paths:
        - .go/cache/
  script:
    - pipe test
  tags:
    - amd64
    - docker

test:internal:
  extends: .test
  variables:
    GO_CWD: ./internal
    # the only job saving the build cache that every other job here and in the child
    # pipelines reads. A cache archive is uploaded whole and the last upload wins, so
    # only this one, which compiles the most of the workspace, saves it.
    GO_CACHE_POLICY: pull-push
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *internal-paths
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths: *internal-paths
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME

test:tests:
  extends: .test
  variables:
    GO_CWD: ./tests
    GO_CACHE_POLICY: pull
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *tests-paths
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths: *tests-paths
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME

docs:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key:
        prefix: go-build
        files:
          - go.work
      policy: pull
      paths:
        - .go/cache/
  variables:
    TASK_REMOTE_TRUSTED_HOSTS: gitlab.kilic.dev
  script:
    # the readmes are generated from the command trees, so a flag added or renamed
    # without regenerating them leaves them stale.
    - task docs
    - |-
      git diff --exit-code -- '**/README.md' || (echo "readmes are stale, run: task docs" && exit 1)
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: &docs-paths
        - "**/*.go"
        - "**/go.mod"
        - "**/README.md"
        - Taskfile.yml
        - Taskfile.pipe.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths: *docs-paths
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  tags:
    - amd64
    - docker

build:template:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key:
        prefix: go-build
        files:
          - go.work
      policy: pull
      paths:
        - .go/cache/
  variables:
    GO_CWD: _template
    GO_BUILD_BINARY_NAME: pipe
  script:
    # the scaffold ships no image and gets no trigger child pipeline, so this is the
    # only job that keeps it compiling against the workspace.
    - pipe build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *template-paths
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths: *template-paths
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  tags:
    - amd64
    - docker

semantic-release:
  stage: release
  extends: .semantic-release
  dependencies: []
  variables:
    SEMANTIC_RELEASE_WORKSPACE: "true"

update-docker-hub-readme:
  stage: post
  image: cenk1cenk2/pipe-update-docker-hub-readme:latest
  dependencies: []
  variables:
    DOCKER_HUB_USERNAME: $DOCKERHUB_USERNAME
    DOCKER_HUB_PASSWORD: $DOCKERHUB_PASSWORD
    DOCKER_HUB_README_MATRIX: |
      [
        {
          "repository": "cenk1cenk2/pipe-buildah",
          "file": "./buildah/README.md",
          "description": "Builds and publishes a container image with given conditions."
        },
        {
          "repository": "cenk1cenk2/pipe-node",
          "file": "./node/README.md",
          "description": "Node.JS operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-pulumi",
          "file": "./pulumi/README.md",
          "description": "Pulumi operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-go",
          "file": "./go/README.md",
          "description": "Golang operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-github",
          "file": "./github/README.md",
          "description": "GitHub App tokens and commit statuses for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-helm",
          "file": "./helm/README.md",
          "description": "Helm operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-kustomize",
          "file": "./kustomize/README.md",
          "description": "Kustomize operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-mise",
          "file": "./mise/README.md",
          "description": "mise tool installs for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-semantic-release",
          "file": "./semantic-release/README.md",
          "description": "semantic-release embedded inside a container for CI jobs."
        },
        {
          "repository": "cenk1cenk2/pipe-terraform",
          "file": "./terraform/README.md",
          "description": "Terraform helper pipe."
        },
        {
          "repository": "cenk1cenk2/pipe-update-docker-hub-readme",
          "file": "./update-docker-hub-readme/README.md",
          "description": "Updates the README on DockerHub for given repository."
        }
      ]
  tags:
    - docker
  script:
    - pipe
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "**/README.md"
