---
stages:
  - bootstrap
  - install
  - test
  - pipes
  - post

include:
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: buildah
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: go
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_BUILD_ARGS: |-
            GO_VERSION: '{{ env "GO_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "GO_VERSION" }}
          GO_VERSION:
            - 1.25-alpine
            - 1.26-alpine
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_BUILD_ARGS: |-
            GO_VERSION: '{{ env "GO_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "GO_VERSION" }}
          CONTAINER_IMAGE_TAGS_AS_LATEST: '["^heads/main$", "^tags/.*"]'
          GO_VERSION:
            - 1.27-alpine
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: helm
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: kustomize
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: node
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_BUILD_ARGS: |-
            NODE_VERSION: '{{ env "NODE_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "NODE_VERSION" }}
          NODE_VERSION:
            - 22
            - 22-alpine
            - 24
            - 24-alpine
            - 26
            - 26-alpine
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: pulumi
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile-node
          CONTAINER_IMAGE_BUILD_ARGS: |-
            PULUMI_VERSION: '{{ env "PULUMI_VERSION" }}'
            NODE_VERSION: '{{ env "NODE_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "PULUMI_VERSION" }}-node
          PULUMI_VERSION:
            - latest
          NODE_VERSION: 26-alpine
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: select-env
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: semantic-release
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_BUILD_ARGS: |-
            NODE_VERSION: 26-alpine
          CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: terraform
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_TAGS: |-
            latest
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: update-docker-hub-readme
      container-matrix:
        - CONTAINER_FILE_NAME: Dockerfile
          CONTAINER_IMAGE_TAGS: |-
            latest

.rules-default: &rules-default
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    interruptible: true
  - if: $CI_COMMIT_TAG

bootstrap:
  stage: bootstrap
  trigger:
    strategy: depend
    include:
      - local: .gitlab-ci.bootstrap.yml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - .gitlab-ci.yml
          - go.mod
          - go.sum
          - .gitlab-ci.bootstrap.yml
          - go/**/*
          - buildah/**/*
    - if: $CI_COMMIT_TAG

install:
  stage: install
  image: cenk1cenk2/pipe-go:bootstrap
  script:
    - pipe install
  artifacts:
    paths:
      - vendor/
  cache:
    - key: $CI_JOB_NAME_SLUG
      paths:
        - vendor/
        - .go/
  rules: *rules-default
  tags:
    - amd64
    - docker

lint:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  cache:
    - key: $CI_JOB_NAME_SLUG
      paths:
        - .go/cache/
  script:
    - pipe lint
  rules: *rules-default
  tags:
    - amd64
    - docker

generate:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  script:
    - task --yes generate
    - git status --porcelain -- '**/test/mocks/**'
    - |-
      test -z "$(git status --porcelain -- '**/test/mocks/**')" || (echo "mocks are stale, run: task generate" && exit 1)
  rules: *rules-default
  tags:
    - amd64
    - docker

test:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key: $CI_JOB_NAME_SLUG
      paths:
        - .go/cache/
  script:
    - go test -v ./...
  rules: *rules-default
  tags:
    - amd64
    - docker

update-docker-hub-readme:
  stage: post
  image: cenk1cenk2/pipe-update-docker-hub-readme:latest
  dependencies: []
  variables:
    DOCKER_USERNAME: $DOCKERHUB_USERNAME
    DOCKER_PASSWORD: $DOCKERHUB_API_PASSWORD
    README_MATRIX: |
      [
        {
          "repository": "cenk1cenk2/pipe-buildah",
          "file": "./buildah/README.md",
          "description": "Builds and publishes a container image with given conditions."
        },
        {
          "repository": "cenk1cenk2/pipe-node",
          "file": "./node/README.md",
          "description": "Node.JS operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-pulumi",
          "file": "./pulumi/README.md",
          "description": "Pulumi operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-go",
          "file": "./go/README.md",
          "description": "Golang operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-helm",
          "file": "./helm/README.md",
          "description": "Helm operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-kustomize",
          "file": "./kustomize/README.md",
          "description": "Kustomize operations for pipelines."
        },
        {
          "repository": "cenk1cenk2/pipe-select-env",
          "file": "./select-env/README.md",
          "description": "Selects an environment given on the conditions."
        },
        {
          "repository": "cenk1cenk2/pipe-semantic-release",
          "file": "./semantic-release/README.md",
          "description": "semantic-release embedded inside a container for CI jobs."
        },
        {
          "repository": "cenk1cenk2/pipe-terraform",
          "file": "./terraform/README.md",
          "description": "Terraform helper pipe."
        },
        {
          "repository": "cenk1cenk2/pipe-update-docker-hub-readme",
          "file": "./update-docker-hub-readme/README.md",
          "description": "Updates the README on DockerHub for given repository."
        }
      ]
  tags:
    - docker
  script:
    - pipe
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "**/README.md"
    - if: $CI_COMMIT_TAG
