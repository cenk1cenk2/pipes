---
stages:
  - bootstrap
  - install
  - build
  - test
  - container
  - post

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go/cache

.rules-default: &rules-default
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    interruptible: true
  - if: $CI_COMMIT_TAG

# the :bootstrap images every other job runs on. Built from stock images so a
# broken pipe can never brick the pipeline that fixes it. Publish-only: no merge
# request arm.
.rules-bootstrap: &rules-bootstrap
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    changes:
      paths:
        - .gitlab-ci.yml
        - go.work
        - go.work.sum
        - internal/**/*
        - go/**/*
        - buildah/**/*
  - if: $CI_COMMIT_TAG

bootstrap:build:
  stage: bootstrap
  image: golang:1.27-alpine
  variables:
    GO_BUILD_BINARY_NAME: pipe
    GO_BUILD_LINKER_FLAGS: -w -s
    GO_BUILD_VARIABLES: |-
      main.VERSION: bootstrap.{{ now | date "2006-01-02T15:04:05Z0700" }}
  script:
    - wget -O- -nv https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | BINDIR=/usr/bin sh -s
    - go work vendor
    - |-
      for mod in $(go list -m -f '{{.Dir}}'); do
        go -C "$mod" mod verify
      done
    - go build -C go -mod=vendor -o dist/pipe-bootstrap
    - ./go/dist/pipe-bootstrap --version
    # lint runs at the repository root and detects the workspace file there, while
    # each build points GO_CWD at one module and stays on it.
    - ./go/dist/pipe-bootstrap lint
    - GO_CWD=./go ./go/dist/pipe-bootstrap build
    - GO_CWD=./buildah ./go/dist/pipe-bootstrap build
  cache:
    - key: bootstrap-build
      paths:
        - vendor/
        - .go/
  artifacts:
    paths:
      - go/dist/
      - buildah/dist/
  rules: *rules-bootstrap
  tags:
    - amd64
    - docker

bootstrap:container:
  stage: bootstrap
  image: quay.io/buildah/stable:latest
  needs:
    - bootstrap:build
  variables:
    CONTAINER_IMAGE_TAGS: bootstrap
    CONTAINER_REGISTRY_USERNAME: $DOCKERHUB_USERNAME
    CONTAINER_REGISTRY_PASSWORD: $DOCKERHUB_PASSWORD
  parallel:
    matrix:
      - CONTAINER_FILE_CONTEXT: ./go
        CONTAINER_IMAGE_NAME: cenk1cenk2/pipe-go
        CONTAINER_IMAGE_BUILD_ARGS: |-
          GO_VERSION: 1.27-alpine
      - CONTAINER_FILE_CONTEXT: ./buildah
        CONTAINER_IMAGE_NAME: cenk1cenk2/pipe-buildah
        CONTAINER_IMAGE_BUILD_ARGS: |-
          BUILDAH_VERSION: latest
  script:
    # the merged build leg above ships both dist directories; the buildah pipe
    # binary it built is what builds the bootstrap images.
    - ./buildah/dist/pipe-linux-amd64 build
  rules: *rules-bootstrap
  tags:
    - amd64
    - docker

install:
  stage: install
  image: cenk1cenk2/pipe-go:bootstrap
  script:
    # the published bootstrap image predates this workspace and still hardcodes
    # "go mod vendor", which Go refuses in workspace mode, so vendor with the
    # toolchain first and build the pipe this branch ships.
    - go work vendor
    - go build -C go -mod=vendor -o dist/pipe-bootstrap
    - ./go/dist/pipe-bootstrap install
  artifacts:
    paths:
      - vendor/
      - go/dist/
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - vendor/
        - .go/
  rules: *rules-default
  tags:
    - amd64
    - docker

lint:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - .go/cache/
  script:
    # the binary built from this branch detects the workspace file at the repository
    # root; the one baked into the image would lint the root as a module.
    - ./go/dist/pipe-bootstrap lint
  rules: *rules-default
  tags:
    - amd64
    - docker

generate:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  script:
    - task --yes generate
    - git status --porcelain -- '**/test/mocks/**'
    - |-
      test -z "$(git status --porcelain -- '**/test/mocks/**')" || (echo "mocks are stale, run: task generate" && exit 1)
  rules: *rules-default
  tags:
    - amd64
    - docker

test:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - .go/cache/
  script:
    - task --yes test
  rules: *rules-default
  tags:
    - amd64
    - docker

docs:
  stage: test
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  cache:
    - key: $CI_JOB_NAME_SLUG-v2
      paths:
        - .go/cache/
  script:
    # the readmes are generated from the command trees, so a flag added or renamed
    # without regenerating them leaves them stale.
    - task --yes docs
    - |-
      git diff --exit-code -- '**/README.md' || (echo "readmes are stale, run: task docs" && exit 1)
  rules: *rules-default
  tags:
    - amd64
    - docker

build:template:
  stage: build
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  variables:
    GO_CWD: _template
    GO_BUILD_BINARY_NAME: pipe
  script:
    # the scaffold ships no image and gets no trigger child pipeline, so this is the
    # only job that keeps it compiling against the workspace.
    - ./go/dist/pipe-bootstrap build
  rules: *rules-default
  tags:
    - amd64
    - docker

.build:
  stage: build
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - install
  variables:
    GO_CWD: ./$PIPE_NAME
    GO_BUILD_BINARY_NAME: pipe
    GO_BUILD_LINKER_FLAGS: -w -s
    GO_BUILD_VARIABLES: |-
      main.VERSION: BUILD.{{ now | date "2006-01-02T15:04:05Z0700" }}
    GO_BUILD_TARGETS: |-
      - os: linux
        arch: amd64
  cache:
    - key: $CI_JOB_NAME_SLUG
      paths:
        - .go/cache/
  artifacts:
    paths:
      - $PIPE_NAME/dist/
  script:
    # the parent hands down the binary it built from this commit, so the pipe that
    # builds every other pipe is never a release behind the flags it is given.
    - ./go/dist/pipe-bootstrap build
  tags:
    - amd64
    - docker

.container:
  stage: container
  # no needs: the container stage waits for every build and test job, so an image
  # only publishes out of a fully green pipeline.
  image: cenk1cenk2/pipe-buildah:bootstrap
  variables:
    CONTAINER_REGISTRY_USERNAME: $DOCKERHUB_USERNAME
    CONTAINER_REGISTRY_PASSWORD: $DOCKERHUB_PASSWORD
    CONTAINER_FILE_CONTEXT: ./$PIPE_NAME
    CONTAINER_FILE_NAME: Dockerfile
    CONTAINER_IMAGE_NAME: cenk1cenk2/pipe-$PIPE_NAME
  script:
    - pipe build
  tags:
    - amd64
    - docker

build:buildah:
  extends: .build
  variables:
    PIPE_NAME: buildah
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - .gitlab-ci.yml
          - go.work
          - go.work.sum
          - internal/**/*
          - buildah/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths:
          - .gitlab-ci.yml
          - go.work
          - go.work.sum
          - internal/**/*
          - buildah/**/*
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_TAG

container:buildah:
  extends: .container
  dependencies:
    - build:buildah
  variables:
    PIPE_NAME: buildah
    CONTAINER_IMAGE_TAGS: latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - .gitlab-ci.yml
          - go.work
          - go.work.sum
          - internal/**/*
          - buildah/**/*
    - if: $CI_COMMIT_TAG

build:go:
  extends: .build
  variables:
    PIPE_NAME: go
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - .gitlab-ci.yml
          - go.work
          - go.work.sum
          - internal/**/*
          - go/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      interruptible: true
      changes:
        paths:
          - .gitlab-ci.yml
          - go.work
          - go.work.sum
          - internal/**/*
          - go/**/*
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_TAG

container:go:
  extends: .container
  dependencies:
    - build:go
  variables:
    PIPE_NAME: go
  parallel:
    matrix:
      - CONTAINER_IMAGE_BUILD_ARGS: |-
          GO_VERSION: '{{ env "GO_VERSION" }}'
        CONTAINER_IMAGE_TAGS: |-
          {{ env "GO_VERSION" }}
        GO_VERSION:
          - 1.25-alpine
          - 1.26-alpine
      - CONTAINER_IMAGE_BUILD_ARGS: |-
          GO_VERSION: '{{ env "GO_VERSION" }}'
        CONTAINER_IMAGE_TAGS: |-
          {{ env "GO_VERSION" }}
        CONTAINER_IMAGE_TAGS_AS_LATEST: '["^heads/main$", "^tags/.*"]'
        GO_VERSION:
          - 1.27-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - .gitlab-ci.yml
          - go.work
          - go.work.sum
          - internal/**/*
          - go/**/*
    - if: $CI_COMMIT_TAG

