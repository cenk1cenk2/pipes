---
# https://taskfile.dev

version: "3"

vars: {}

env:
  CGO_ENABLED: 0
  GO_VERSION: 1.27

output: prefixed

includes:
  go-workspace:
    taskfile: https://gitlab.kilic.dev/libraries/taskfiles/-/raw/main/Taskfile.go-workspace.yml?ref_type=heads
    flatten: true
    excludes:
      - test
  template:
    dir: ./template
    taskfile: ./Taskfile.pipe.yml
    # The scaffold ships no specs of its own, and ginkgo fails a run that finds
    # no suites, so the pipe it seeds is the first thing with a test task.
    excludes:
      - test
  buildah:
    dir: ./buildah
    taskfile: ./Taskfile.pipe.yml
  go:
    dir: ./go
    taskfile: ./Taskfile.pipe.yml
  helm:
    dir: ./helm
    taskfile: ./Taskfile.pipe.yml
  kustomize:
    dir: ./kustomize
    taskfile: ./Taskfile.pipe.yml
  node:
    dir: ./node
    taskfile: ./Taskfile.pipe.yml
  pulumi:
    dir: ./pulumi
    taskfile: ./Taskfile.pipe.yml
  select-env:
    dir: ./select-env
    taskfile: ./Taskfile.pipe.yml
  semantic-release:
    dir: ./semantic-release
    taskfile: ./Taskfile.pipe.yml
  terraform:
    dir: ./terraform
    taskfile: ./Taskfile.pipe.yml
  update-docker-hub-readme:
    dir: ./update-docker-hub-readme
    taskfile: ./Taskfile.pipe.yml

tasks:
  packages:
    internal: true
    deps:
      - task: "template:{{ .command }}"
      - task: "buildah:{{ .command }}"
      - task: "go:{{ .command }}"
      - task: "helm:{{ .command }}"
      - task: "kustomize:{{ .command }}"
      - task: "node:{{ .command }}"
      - task: "pulumi:{{ .command }}"
      - task: "select-env:{{ .command }}"
      - task: "semantic-release:{{ .command }}"
      - task: "terraform:{{ .command }}"
      - task: "update-docker-hub-readme:{{ .command }}"

  build:
    desc: Builds all the applications.
    cmds:
      - task: packages
        vars:
          command: build

  docs:
    desc: Generates documentation for all applications.
    cmds:
      - task: packages
        vars:
          command: docs

  test:
    desc: Tests every module in the workspace with ginkgo.
    cmds:
      - |-
        go tool ginkgo \
        --cover --coverpkg=./... --coverprofile=coverage.out \
        -vv --silence-skips --fail-fast -r \
        {{ .CLI_ARGS }} \
        ./...

  generate:
    desc: Generates checked-in files.
    cmds:
      - task: generate:mockery

  generate:mockery:
    internal: true
    cmds:
      - go tool mockery
    generates:
      - "**/test/mocks/**"
    sources:
      - .mockery.yaml
      - "**/*.go"
      - "**/go.{mod,sum}"
      - go.work
      - exclude: "**/test/mocks/**"
