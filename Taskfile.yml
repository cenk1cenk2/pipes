---
# https://taskfile.dev

version: "3"

vars: {}

env:
  CGO_ENABLED: 0
  GO_VERSION: 1.27

output: prefixed

includes:
  go-workspace:
    taskfile: https://gitlab.kilic.dev/libraries/taskfiles/-/raw/main/Taskfile.go-workspace.yml?ref_type=heads
    flatten: true
  template:
    dir: ./template
    taskfile: ./Taskfile.pipe.yml
  buildah:
    dir: ./pipes/buildah
    taskfile: ./Taskfile.pipe.yml
  go:
    dir: ./pipes/go
    taskfile: ./Taskfile.pipe.yml
  helm:
    dir: ./pipes/helm
    taskfile: ./Taskfile.pipe.yml
  kustomize:
    dir: ./pipes/kustomize
    taskfile: ./Taskfile.pipe.yml
  node:
    dir: ./pipes/node
    taskfile: ./Taskfile.pipe.yml
  pulumi:
    dir: ./pipes/pulumi
    taskfile: ./Taskfile.pipe.yml
  select-env:
    dir: ./pipes/select-env
    taskfile: ./Taskfile.pipe.yml
  semantic-release:
    dir: ./pipes/semantic-release
    taskfile: ./Taskfile.pipe.yml
  terraform:
    dir: ./pipes/terraform
    taskfile: ./Taskfile.pipe.yml
  update-docker-hub-readme:
    dir: ./pipes/update-docker-hub-readme
    taskfile: ./Taskfile.pipe.yml

tasks:
  packages:
    internal: true
    deps:
      - task: "template:{{ .command }}"
      - task: "buildah:{{ .command }}"
      - task: "go:{{ .command }}"
      - task: "helm:{{ .command }}"
      - task: "kustomize:{{ .command }}"
      - task: "node:{{ .command }}"
      - task: "pulumi:{{ .command }}"
      - task: "select-env:{{ .command }}"
      - task: "semantic-release:{{ .command }}"
      - task: "terraform:{{ .command }}"
      - task: "update-docker-hub-readme:{{ .command }}"

  build:
    desc: Builds all the applications.
    cmds:
      - task: packages
        vars:
          command: build

  docs:
    desc: Generates documentation for all applications.
    cmds:
      - task: packages
        vars:
          command: docs

  generate:
    desc: Generates checked-in files.
    cmds:
      - task: generate:mockery

  generate:mockery:
    internal: true
    cmds:
      - go tool mockery
    generates:
      - "**/test/mocks/**"
    sources:
      - .mockery.yaml
      - "**/*.go"
      - "**/go.{mod,sum}"
      - go.work
      - exclude: "**/test/mocks/**"
