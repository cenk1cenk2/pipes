---
# https://taskfile.dev

version: "3"

vars:
  # every pipe module the fan-out tasks iterate, space separated. The template comes
  # first, so the scaffold breaks before the published pipes do.
  PACKAGES: >-
    template buildah go helm kustomize node pulumi select-env
    semantic-release terraform update-docker-hub-readme

env:
  CGO_ENABLED: 0
  GO_VERSION: 1.27

output: prefixed

includes:
  go-workspace:
    taskfile: https://gitlab.kilic.dev/libraries/taskfiles/-/raw/main/Taskfile.go-workspace.yml?ref_type=heads
    flatten: true
    excludes:
      - test
  template:
    dir: ./_template
    taskfile: ./Taskfile.pipe.yml
    # the scaffold ships no specs and ginkgo fails a run that finds no suites.
    excludes:
      - test
  # include keys are static YAML and cannot be driven by a variable, so this is the
  # one place the pipe list stays written out.
  buildah:
    dir: ./buildah
    taskfile: ./Taskfile.pipe.yml
  go:
    dir: ./go
    taskfile: ./Taskfile.pipe.yml
  helm:
    dir: ./helm
    taskfile: ./Taskfile.pipe.yml
  kustomize:
    dir: ./kustomize
    taskfile: ./Taskfile.pipe.yml
  node:
    dir: ./node
    taskfile: ./Taskfile.pipe.yml
  pulumi:
    dir: ./pulumi
    taskfile: ./Taskfile.pipe.yml
  select-env:
    dir: ./select-env
    taskfile: ./Taskfile.pipe.yml
  semantic-release:
    dir: ./semantic-release
    taskfile: ./Taskfile.pipe.yml
  terraform:
    dir: ./terraform
    taskfile: ./Taskfile.pipe.yml
  update-docker-hub-readme:
    dir: ./update-docker-hub-readme
    taskfile: ./Taskfile.pipe.yml

tasks:
  build:
    desc: Builds all the applications.
    deps:
      - for: { var: PACKAGES }
        task: "{{ .ITEM }}:build"

  docs:
    desc: Generates documentation for all applications.
    # parallel `go run` compilations exhaust the memory of the CI runner, so the
    # documentation is generated one pipe at a time.
    cmds:
      - for: { var: PACKAGES }
        task: "{{ .ITEM }}:docs"

  test:
    desc: Tests every module in the workspace with ginkgo.
    cmds:
      - |-
        go tool ginkgo \
        --cover --coverpkg=./... --coverprofile=coverage.out \
        -vv --silence-skips --fail-fast -r \
        {{ .CLI_ARGS }} \
        ./...

  generate:
    desc: Generates checked-in files.
    cmds:
      - task: generate:mockery

  generate:mockery:
    internal: true
    cmds:
      - go tool mockery
    generates:
      - "**/test/mocks/**"
    sources:
      - .mockery.yaml
      - "**/*.go"
      - "**/go.{mod,sum}"
      - go.work
      - exclude: "**/test/mocks/**"
