---
spec:
  inputs:
    name:
      type: string
      description: >-
        The name of the pipe, which keys its own build cache. GitLab cache keys
        cannot carry the slash in container-image-name.
    cwd:
      type: string
      description: The working directory of the pipe.
    container-image-name:
      type: string
      description: The name of the container image.
    container-matrix:
      type: array
      description: A matrix of containers for building images.
    release-variable:
      type: string
      description: >-
        The variable the release hands the tag of this pipe over in. The parent
        forwards the release's dotenv report to this pipeline as trigger
        variables, so it is already known when the rules are evaluated.
---
stages:
  - build
  - container

variables:
  GO_CWD: $[[inputs.cwd]]
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go/cache

build:
  stage: build
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    # the parent's install job vendored the workspace; reaching across the pipeline
    # boundary for its artifacts is what keeps this job from vendoring all over again.
    - pipeline: $CI_PARENT_PIPELINE_ID
      job: install
      artifacts: true
  variables:
    GO_BUILD_BINARY_NAME: pipe
    GO_BUILD_LINKER_FLAGS: -w -s
    GO_BUILD_VARIABLES: |-
      main.version: BUILD.{{ now | date "2006-01-02T15:04:05Z0700" }}
    GO_BUILD_TARGETS: |-
      - os: linux
        arch: amd64
  cache:
    # warmed by the parent's test job, which runs in an earlier stage.
    - key:
        prefix: go-build
        files:
          - go.work
      policy: pull
      paths:
        - .go/cache/
    # warmed by this pipe's own test job on an earlier run.
    - key:
        prefix: go-build-$[[inputs.name]]
        files:
          - go.work
      policy: pull
      paths:
        - .go/cache/
  artifacts:
    paths:
      - $GO_CWD/dist/
  script:
    - pipe build
  rules:
    - when: always
  tags:
    - amd64
    - docker

lint:
  stage: build
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - pipeline: $CI_PARENT_PIPELINE_ID
      job: install
      artifacts: true
  cache:
    - key:
        prefix: go-build
        files:
          - go.work
      policy: pull
      paths:
        - .go/cache/
    - key:
        prefix: go-build-$[[inputs.name]]
        files:
          - go.work
      policy: pull
      paths:
        - .go/cache/
    - key: $CI_JOB_NAME_SLUG-golangci-lint-$[[inputs.name]]
      policy: pull
      paths:
        - .go/golangci-lint/
  script:
    - pipe lint
  rules:
    - when: always
  tags:
    - amd64
    - docker

test:
  stage: build
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - pipeline: $CI_PARENT_PIPELINE_ID
      job: install
      artifacts: true
  cache:
    - key:
        prefix: go-build
        files:
          - go.work
      policy: pull
      paths:
        - .go/cache/
    # the shared cache only covers the parent's packages, so this pipe's own ones are
    # saved under a key of their own.
    - key:
        prefix: go-build-$[[inputs.name]]
        files:
          - go.work
      policy: pull-push
      paths:
        - .go/cache/
  script:
    - pipe test
  rules:
    - when: always
  tags:
    - amd64
    - docker

container:
  stage: container
  image: cenk1cenk2/pipe-buildah:bootstrap
  needs:
    - job: build
    - job: lint
    - job: test
  variables:
    CONTAINER_REGISTRY_USERNAME: $DOCKERHUB_USERNAME
    CONTAINER_REGISTRY_PASSWORD: $DOCKERHUB_PASSWORD
    CONTAINER_FILE_CONTEXT: $[[inputs.cwd]]
    CONTAINER_IMAGE_NAME: $[[inputs.container-image-name]]
  parallel:
    matrix: $[[inputs.container-matrix]]
  script:
    - pipe build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $$[[inputs.release-variable]]
    # a change the release does not tag, like one outside every pipe directory, or a
    # tag whose own pipeline never built the pipe, is published by playing this job
    # on the latest pipeline of the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  tags:
    - amd64
    - docker
