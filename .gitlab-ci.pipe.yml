---
spec:
  inputs:
    name:
      type: string
      description: >-
        The name of the pipe, which keys its own build cache. GitLab cache keys
        cannot carry the slash in container-image-name.
    cwd:
      type: string
      description: The working directory of the pipe.
    container-image-name:
      type: string
      description: The name of the container image.
    container-matrix:
      type: array
      description: A matrix of containers for building images.
---
stages:
  - build
  - container

variables:
  GO_CWD: $[[inputs.cwd]]
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go/cache

build:
  stage: build
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    # the parent's install job vendored the workspace; reaching across the pipeline
    # boundary for its artifacts is what keeps this job from vendoring all over again.
    - pipeline: $CI_PARENT_PIPELINE_ID
      job: install
      artifacts: true
  variables:
    GO_BUILD_BINARY_NAME: pipe
    GO_BUILD_LINKER_FLAGS: -w -s
    GO_BUILD_VARIABLES: |-
      main.version: BUILD.{{ now | date "2006-01-02T15:04:05Z0700" }}
    GO_BUILD_TARGETS: |-
      - os: linux
        arch: amd64
  cache:
    # saved by this pipe's own test job on an earlier run, and until there is one, by the
    # parent's test job, which compiles the packages every pipe shares.
    - key: go-build-$[[inputs.name]]
      fallback_keys:
        - go-build
      policy: pull
      paths:
        - .go/cache/
  artifacts:
    paths:
      - $GO_CWD/dist/
  script:
    - pipe build
  rules:
    - when: always
  tags:
    - amd64
    - docker

lint:
  stage: build
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - pipeline: $CI_PARENT_PIPELINE_ID
      job: install
      artifacts: true
  cache:
    - key: go-build-$[[inputs.name]]
      fallback_keys:
        - go-build
      policy: pull
      paths:
        - .go/cache/
    - key: lint-$[[inputs.name]]
      paths:
        - .go/golangci-lint/
  script:
    - pipe lint
  rules:
    - when: always
  tags:
    - amd64
    - docker

test:
  stage: build
  image: cenk1cenk2/pipe-go:bootstrap
  needs:
    - pipeline: $CI_PARENT_PIPELINE_ID
      job: install
      artifacts: true
  cache:
    # the shared cache only covers the parent's packages, so this pipe's own ones are
    # saved under a key of their own, which the build and lint jobs read.
    - key: go-build-$[[inputs.name]]
      fallback_keys:
        - go-build
      paths:
        - .go/cache/
  script:
    - pipe test
  rules:
    - when: always
  tags:
    - amd64
    - docker

container:
  stage: container
  image: cenk1cenk2/pipe-buildah:bootstrap
  needs:
    - job: build
    - job: lint
    - job: test
  variables:
    CONTAINER_REGISTRY_USERNAME: $DOCKERHUB_USERNAME
    CONTAINER_REGISTRY_PASSWORD: $DOCKERHUB_PASSWORD
    CONTAINER_FILE_CONTEXT: $[[inputs.cwd]]
    CONTAINER_IMAGE_NAME: $[[inputs.container-image-name]]
    # the version of a <pipe>@<version> tag is published next to the tags of the
    # matrix. A leg publishing more than one flavour overrides the template to keep
    # the version of every flavour apart.
    TAGS_FROM_ENVIRONMENT: CI_COMMIT_TAG
    CONTAINER_IMAGE_TAGS_TEMPLATE: |-
      - match: ^[^@]+@(.+)$
        template: v{{ index $ 1 }}
  parallel:
    matrix: $[[inputs.container-matrix]]
  script:
    - pipe build
  rules:
    - if: $CI_COMMIT_TAG
    # the default branch only builds a pipe in a pipeline started by hand, which
    # publishes from that commit when this job is played.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  tags:
    - amd64
    - docker
