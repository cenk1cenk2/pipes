---
include:
  - local: .gitlab-ci.trigger.yml
    inputs:
      name: go
      dir: go
      container-matrix:
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            GO_VERSION: '{{ env "GO_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "GO_VERSION" }}
          CONTAINER_IMAGE_TAGS_TEMPLATE: |-
            - match: ^[^@]+@(.+)$
              template: '{{ env "GO_VERSION" }}-v{{ index $ 1 }}'
          GO_VERSION:
            - 1.25-alpine
            - 1.26-alpine
        - CONTAINER_IMAGE_BUILD_ARGS: |-
            GO_VERSION: '{{ env "GO_VERSION" }}'
          CONTAINER_IMAGE_TAGS: |-
            {{ env "GO_VERSION" }}
          CONTAINER_IMAGE_TAGS_TEMPLATE: |-
            - match: ^[^@]+@(.+)$
              template: '{{ env "GO_VERSION" }}-v{{ index $ 1 }}'
          CONTAINER_IMAGE_TAGS_AS_LATEST: |-
            - ^tags/go@
            - ^heads/main$
          GO_VERSION:
            - 1.27-alpine
